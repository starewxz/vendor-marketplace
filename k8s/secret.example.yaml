# Template only — copy this file to secret.yaml, fill in real local values,
# and apply it separately (kubectl apply -f k8s/secret.yaml). secret.yaml is
# gitignored; never commit real secrets.
#
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   # edit k8s/secret.yaml with real values, then:
#   kubectl apply -f k8s/secret.yaml
#
# Keys match exactly what backend/src/common/config/env.validation.ts
# requires (DATABASE_URL, MEILISEARCH_API_KEY, JWT_ACCESS_SECRET,
# JWT_REFRESH_SECRET) plus the other credential-shaped values docker-compose
# already treats as sensitive (POSTGRES_PASSWORD, Google OAuth, seed
# passwords). DATABASE_URL must stay in sync with POSTGRES_USER/DB in
# configmap.yaml and POSTGRES_PASSWORD below — Kubernetes has no native way
# to interpolate one env var from others, so it's written out in full here,
# same as docker-compose.yml does inline.
apiVersion: v1
kind: Secret
metadata:
  name: marketplace-secrets
  namespace: marketplace
type: Opaque
stringData:
  POSTGRES_PASSWORD: 'changeme_postgres_password'
  DATABASE_URL: 'postgresql://marketplace:changeme_postgres_password@postgres:5432/marketplace'

  MEILISEARCH_API_KEY: 'changeme_meilisearch_master_key'

  JWT_ACCESS_SECRET: 'changeme_jwt_access_secret'
  JWT_REFRESH_SECRET: 'changeme_jwt_refresh_secret'

  # Leave blank to keep Google OAuth cleanly disabled (same behavior as
  # local dev — see README "Google OAuth"). Fill in only if you want to
  # exercise the real OAuth flow against this cluster.
  GOOGLE_OAUTH_CLIENT_ID: ''
  GOOGLE_OAUTH_CLIENT_SECRET: ''

  # Only used by the optional seed-admin/seed-demo Jobs (see
  # k8s/backend/seed-admin-job.yaml, seed-demo-job.yaml) — never applied
  # automatically.
  ADMIN_PASSWORD: 'changeme_admin_password'
  DEMO_SELLER_PASSWORD: 'changeme_demo_seller_password'
