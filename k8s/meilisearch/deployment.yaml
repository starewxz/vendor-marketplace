# Single replica, matches docker-compose. MEILI_MASTER_KEY is sourced from
# the same MEILISEARCH_API_KEY secret key the backend uses, so there's one
# source of truth for the value instead of duplicating it under two names.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meilisearch
  namespace: marketplace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meilisearch
  template:
    metadata:
      labels:
        app: meilisearch
    spec:
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:v1.10
          ports:
            - containerPort: 7700
          env:
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: marketplace-secrets
                  key: MEILISEARCH_API_KEY
            - name: MEILI_ENV
              valueFrom:
                configMapKeyRef:
                  name: marketplace-config
                  key: MEILI_ENV
            - name: MEILI_NO_ANALYTICS
              valueFrom:
                configMapKeyRef:
                  name: marketplace-config
                  key: MEILI_NO_ANALYTICS
          volumeMounts:
            - name: meilisearch-data
              mountPath: /meili_data
          readinessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: meilisearch-data
          persistentVolumeClaim:
            claimName: meilisearch-pvc
